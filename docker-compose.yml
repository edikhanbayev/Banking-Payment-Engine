services:

  postgres:
    image: postgres:18
    container_name: ledger-postgres

    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger

    ports:
      - "5432:5432"

    volumes:
      - ledger_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger_postgres_data: